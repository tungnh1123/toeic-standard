# -------------------------------------------------------------
# Render Infrastructure as Code (render.yaml)
# Deploy 100% Free on Render.com Blueprint
# -------------------------------------------------------------
services:
  # Backend NestJS Web Service
  - type: web
    name: toeic-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: toeic-db
          property: connectionString
      - key: DB_SSL
        value: "false"

databases:
  # Free PostgreSQL Database 16
  - name: toeic-db
    plan: free
    region: oregon
    databaseName: toeic_db
    user: rl_admin

