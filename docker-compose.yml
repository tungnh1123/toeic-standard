version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL 16 Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: toeic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-rl_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-toeic_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rl_admin} -d ${DB_NAME:-toeic_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redis 7 (BullMQ & Cache)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: toeic_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # NestJS Backend API
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toeic_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-rl_admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${DB_NAME:-toeic_db}
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-toeic-master-super-secret-key-2026}
      S3_BUCKET_URL: ${S3_BUCKET_URL:-https://s3.ap-southeast-1.amazonaws.com/toeic-storage}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # Web Client (Vite + Nginx)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: toeic_web
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:

